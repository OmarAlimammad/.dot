general {
    no_fade_in = false
    no_fade_out = true
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = ~/.dot/walpaper.jpg
    color = rgb(29, 32, 33) 
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(250, 189, 47)
    font_size = 120
    font_family = FiraCode Nerd Font Semibold
    position = 0, -100
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgb(235, 219, 178)
    font_size = 25
    font_family = FiraCode Nerd Font Bold
    position = 0, -270
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(184, 187, 38)
    inner_color = rgb(60, 56, 54)
    font_color = rgb(235, 219, 178)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    check_color = rgb(131, 165, 152)
    fail_text = .
    fail_color = rgb(251, 73, 52)
    position = 0, -400
    halign = center
    valign = center
}
